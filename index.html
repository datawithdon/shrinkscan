<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://world.openfoodfacts.org; font-src 'self'; worker-src 'self'; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="ShrinkScan: scan a grocery barcode and see whether the package got smaller. It checks Open Food Facts size history and same-brand sizes, and reads shelf-tag prices with your camera. Your data stays on your device.">
  <meta name="theme-color" content="#b45309">
  <title>ShrinkScan</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/scan"><img src="icons/icon.svg" alt="" width="28" height="28">ShrinkScan</a>
      <nav aria-label="Main">
        <a href="#/scan" data-view="scan">Scan</a>
        <a href="#/shrunk" data-view="shrunk">Shrunk <span id="nav-shrunk" class="badge urgent hidden"></span></a>
        <a href="#/prices" data-view="prices">Prices</a>
        <a href="#/settings" data-view="settings">Settings</a>
      </nav>
    </div>
  </header>
  <main id="view" tabindex="-1"><p class="empty">Loading…</p></main>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <footer>Product data from <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener noreferrer">Open Food Facts</a> (ODbL), entered by volunteers, so it can be incomplete or wrong. Your prices and lists stay in this browser. Not affiliated with any retailer or with Open Food Facts.</footer>
  <noscript><p class="empty">ShrinkScan needs JavaScript.</p></noscript>
</body>
</html>
